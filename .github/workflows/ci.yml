# Criterios globales de 00-task.md (G1–G7). Todos bloquean. Solo Windows (ADR 0014).
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CI: "true"

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Herramientas locales
        run: dotnet tool restore
      - name: G1 · Compila sin avisos (y D2/D3 · lock y auditoría al restaurar)
        run: dotnet build Aida.slnx -c Release
      - name: G2/G3 · Batería y arquitectura
        run: dotnet test Aida.slnx -c Release --no-build
      - name: G7 · Ninguna dependencia vulnerable
        shell: pwsh
        run: |
          $out = dotnet list Aida.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          $out
          if ($out -match "has the following vulnerable packages") { throw "dependencias vulnerables" }
      - name: G5 · La documentación de la API se genera sin avisos
        run: dotnet docfx docs/docfx.json --warningsAsErrors
      - name: G6 · La mutación supera el umbral de cada proyecto
        shell: pwsh
        run: |
          $configs = Get-ChildItem tests -Recurse -Filter stryker-config.json | Sort-Object FullName
          foreach ($c in $configs) {
            Push-Location $c.DirectoryName
            dotnet stryker --config-file $c.FullName
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { throw "Stryker por debajo del umbral en $($c.DirectoryName)" }
          }
      - name: G4 · Lo que decide coincide con Python (logs dorados)
        run: dotnet test tests/Aida.Engine.Tests -c Release --no-build --filter Category=Golden -- RunConfiguration.TreatNoTestsAsError=true
