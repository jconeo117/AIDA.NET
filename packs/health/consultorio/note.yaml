# Cómo se le pide al modelo que redacte la nota. En datos porque es la voz del
# documento clínico, y cambia con el país, la especialidad y el gusto del
# prestador.
#
# La instrucción es la única defensa contra que el modelo añada lo que no se
# dijo, aparte del briefing cerrado y del esquema: escríbela como una prohibición,
# no como una sugerencia.
system_prompt: >-
  Redacta la nota de una consulta en español clínico, en tercera persona y en
  pasado. Escribe en registro clínico profesional: reformula las expresiones
  coloquiales sin cambiar el dato —«como dos semanas» es «aproximadamente dos
  semanas», «me duele la cabeza» es «cefalea»—, pero no conviertas síntomas en
  diagnósticos ni añadas categorías clínicas que nadie nombró. Para cada
  apartado, escribe uno o dos párrafos con lo que figura en los
  hechos de ese apartado. Al final va la conversación completa, en orden: sirve
  para entender cada hecho y para no omitir ninguno. Todo hecho clínico que el
  paciente afirme en la conversación —alergias, antecedentes, fármacos y cómo los
  toma— debe figurar en el apartado que le corresponda, aunque no esté entre los
  hechos de ese apartado. Las preguntas del profesional no son hechos: úsalas solo
  para entender la respuesta. Prohibido añadir diagnósticos, cifras, fármacos,
  fechas o datos que no estén en los hechos ni en la conversación; si un apartado
  no tiene hechos, déjalo vacío. No repitas el saludo ni la despedida. No incluyas
  códigos. Prohibido redactar preguntas, interrogatorios o lo que el profesional
  pregunta para averiguar algo: la nota recoge lo que se afirma, no cómo se
  averiguó. Si un apartado solo contiene preguntas, déjalo vacío.
  Prohibido corregir, completar o inventar nombres de fármacos y de enfermedades:
  cópialos exactamente como aparecen en los hechos, aunque parezcan mal escritos.
  Si una palabra es ininteligible, déjala tal cual. Esa prohibición es sobre
  nombres propios y palabras dudosas, no sobre el registro: una expresión
  coloquial clara sí se reformula.

# Quién redacta y con qué versión. En datos por lo mismo que el modelo de
# transcripción: dos mediciones separadas por semanas solo son comparables si
# consta con qué se hicieron.
#
# `provider` admite los cuatro que el proyecto implementa: openai, gemini,
# claude y ollama. Hoy el predeterminado es openai porque es la credencial que
# el despliegue tiene; cambiarlo es esta línea.
provider: "openai"
provider_model: "gpt-4.1-mini"

# El país de cada proveedor de redacción en la nube (plan 85b). `ollama` no va: es este
# equipo. Un proveedor sin país aquí no se usa con autorización de nube.
provider_countries:
  openai: "Estados Unidos"
  claude: "Estados Unidos"
  gemini: "Estados Unidos"

# Encabezado de cada apartado en el archivo exportado.
field_heading: "### {}"

# Al pie del archivo exportado: con qué se redactó. En una historia clínica
# importa poder saber qué escribió un modelo y cuál.
provenance_template: "_Redactado por {} ({})_"

# Qué se escribe cuando no hubo proveedor de lenguaje o falló: los hechos tal
# como se dijeron. No es prosa y no lo pretende — es lo que hay, y decirlo es
# mejor que inventar una plantilla con huecos.
fallback_notice: "(sin redacción: lo que sigue son las frases tal como se dijeron)"

# Bajo la procedencia, qué campos reescribió el profesional en la pantalla. Sin
# esto, «Redactado por …» firmaría como del modelo un texto que no escribió: la
# misma mentira que I-138 e I-143.
edited_template: "_Editado por el profesional: {}_"
