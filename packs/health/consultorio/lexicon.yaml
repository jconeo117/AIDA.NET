# Cómo dice el paciente lo que la historia clínica escribe de otra forma.
#
# El cotejo compara palabras, no significados: «sufro del azúcar» no lleva a
# «diabetes mellitus» por sí solo. Cada entrada de aquí añade el término clínico
# como una consulta más contra el catálogo — no lo mete dentro de la frase, que
# hunde la puntuación (medido).
#
# En datos porque es vocabulario, y el vocabulario cambia con el país y con la
# especialidad. Cada entrada se verificó contra el catálogo real: el código al
# que lleva está anotado al lado.
terms:
