# El brazo de salud, descrito para la plataforma (plan 100). Lo lee `aida.platform.arms`.
id: "health"
name: "Consultorio"
description: "Graba o sube la consulta, revisa la nota y los códigos, y cópialos a la historia."
version: "1"
# Quién construye el brazo: la CLI, que lo monta con sus piezas (101b).
arm: "aida.run:health_arm"
# El símbolo que lo representa en el lanzador.
icon: "stetho"
# Las acciones de la historia clínica (N016, ADR 0039). Firmar es irreversible: solo pasa la puerta con la contraseña
# de quien firma.
actions:
  - {id: "crear_atencion", reversibility: "reversible"}
  - {id: "guardar_atencion", reversibility: "reversible"}
  - {id: "firmar_atencion", reversibility: "irreversible"}
