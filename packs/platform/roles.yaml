# Los roles del personal (ADR 0020). Lo que permite cada rol lo declara este archivo, no el código.
roles:
  - id: administracion
    label: "Administración"
    permissions: [users.manage, agenda.manage, agenda.block]
  - id: recepcion
    label: "Recepción"
    permissions: [agenda.manage, agenda.block]
  - id: profesional
    label: "Profesional"
    permissions: [agenda.manage]
  - id: caja
    label: "Caja"
