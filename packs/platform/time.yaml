# Las palabras del tiempo que entiende el asistente (ADR 0037), también los conectores: en el código no hay ninguna palabra
# de un idioma. Se comparan plegadas: «miércoles» y «miercoles» son la misma.
time:
  relative_days: {"hoy": 0, "mañana": 1, "pasado mañana": 2}
  weekdays: {"lunes": monday, "martes": tuesday, "miércoles": wednesday, "jueves": thursday, "viernes": friday,
             "sábado": saturday, "domingo": sunday}
  months: {"enero": 1, "febrero": 2, "marzo": 3, "abril": 4, "mayo": 5, "junio": 6, "julio": 7, "agosto": 8,
           "septiembre": 9, "octubre": 10, "noviembre": 11, "diciembre": 12}
  periods: {"mañana": morning, "tarde": afternoon, "noche": afternoon}
  period_markers: ["la"]
  noon: ["mediodía"]
  half: ["media"]
  quarter: ["cuarto"]
  and: ["y"]
  hour_markers: ["las", "la"]
  day_articles: ["el"]
  month_links: ["de"]
  hour_links: ["a"]
  period_links: ["de", "en", "por"]
